version: "3.9"

services:
  mitm-proxy:
    build: ./proxy
    container_name: sandbox-proxy
    volumes:
      - ./logs:/logs
    networks:
      - sandbox-net
    # No ports published to the host — the agent can only reach this
    # over the internal sandbox-net and only for proxying traffic.

  agent:
    build: ./agent
    container_name: sandbox-agent
    depends_on:
      - mitm-proxy
    environment:
      - PROXY_HOST=mitm-proxy
      - PROXY_PORT=8080
      - HTTP_PROXY=http://mitm-proxy:8080
      - HTTPS_PROXY=http://mitm-proxy:8080
    cap_add:
      - NET_ADMIN
      # needed ONLY by entrypoint.sh (as root) to set the iptables rules
    networks:
      - sandbox-net
    # No volume gives it access to ./logs. It cannot see, edit, or
    # delete what the proxy records about it.
    # It DOES accept inbound calls on :9000 from brain — that's fine,
    # the lockdown in entrypoint.sh only restricts OUTBOUND traffic.

  brain:
    # The brain image also needs File_Manager/ and agent/ (see brain/Dockerfile),
    # which sit outside ./brain, so the build context is the repository root.
    build:
      context: .
      dockerfile: brain/Dockerfile
    container_name: sandbox-brain
    depends_on:
      - agent
    environment:
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - FOX_API_TOKEN=${FOX_API_TOKEN}
      - AGENT_HOST=agent
      - AGENT_PORT=9000
    volumes:
      - ./data:/data
    ports:
      - "127.0.0.1:7010:7000"
      # entry point: POST /submit_task, GET /tasks
      # Loopback only: the API is token-gated (FOX_API_TOKEN) and
      # /files/delete permanently removes files inside the Vault, so it
      # must not be reachable from the LAN even with auth in front of it.
    networks:
      - sandbox-net
    # Normal network access — this is the "brain," not the sandboxed
    # hands, so it talks to Claude's, Chatgpt's etc..... API directly.

networks:
  sandbox-net:
    driver: bridge
