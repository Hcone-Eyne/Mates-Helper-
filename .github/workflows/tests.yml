name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip

      # tesseract/poppler are only needed by the schedule OCR path; without
      # them the OCR-dependent tests skip rather than fail.
      - name: System dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends tesseract-ocr poppler-utils

      # Pinned so CI resolves the same stack the suite verifies locally.
      # opencv-python-headless stays unpinned: no verified version is
      # recorded for it, and guessing a pin would be worse than floating.
      - name: Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest==9.1.1 rich==15.0.0 pandas==3.0.5 numpy==2.5.1 \
            fastapi==0.141.1 httpx==0.28.1 anthropic==1.4.0 requests==2.34.2 \
            pyyaml==6.0.3 plotext==5.2.8 pillow==12.3.0 pytesseract==0.3.13 \
            pdf2image==1.17.0 pdfplumber==0.11.10 img2table==2.0.0 \
            opencv-python-headless websockets==17.1

      # The default suite is offline: no Ollama, no API keys, no device.
      # Root-level stress_test.py (real LLM iterations) is intentionally not
      # collected here.
      - name: Run test suite
        run: python -m pytest -q test/
